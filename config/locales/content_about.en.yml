# English half of the patient-lifecycle section of the operation manual.
# See content_about.es.yml for why only this section of /about is translated.
en:
  operation_manual:
    lifecycle:
      title: "Patient lifecycle"
      intro: "The state says where a person is in recruitment. There are three, always in the same order, and they change only through an explicit action on the patient's record: editing their clinical data never moves their state."
      intro_note_html: "Forward actions are conditioned on the study's <strong>primary criteria</strong> — the ones that decide — and not on the secondary ones, which inform. Backward actions carry no condition at all."
      arrival_heading: "How a patient gets here"
      transitions_title: "How a patient moves from one state to another"
      notes_title: "What to keep in mind"
      moves_to: "moves to"
      table:
        action: "Action"
        change: "Change"
        who: "Who can do it"
        requires: "What it requires"
      direction:
        forward: "Moves forward"
        backward: "Moves back"
      states:
        interested:
          summary: "Someone who raised their hand about a study. This is the initial state and it claims nothing clinical: there may be no more than a phone number."
          arrival: "Created by the public “I want to participate!” form when somebody leaves their contact details against a study, or registered by a trial centre rep with the full clinical record."
        candidate:
          summary: "Passed triage: there is evidence that every basic criterion is met, so the record deserves a rep's review. That evidence may come from the investigator or be declared by the patient, so a candidate is NOT clinically verified."
          arrival: "Automatically, as soon as the evidence satisfies every basic criterion — whether from the patient's questionnaire or from values a rep records. The “Assess” action stays available for doing it by hand."
        potential:
          summary: "Reviewed and cleared on both tiers: the investigator measured, and every basic AND specific criterion is met. This is the result of recruitment, not an enrolment — joining the trial happens outside the platform."
          arrival: "Through the “Accept” action, which only a person can take — never the system — on a candidate whose basic and specific criteria are all investigator-recorded and met."
      transitions:
        assess:
          actor: "The system, as soon as the evidence suffices; also an admin or trial centre rep by hand. When the system fires it, change control signs it “system:criteria-sync”, not a person."
          requirement: "Every basic criterion answered and met, counting both investigator values and the patient's own declarations. That is the triage level of evidence: enough to reach the review list, not enough to enter the trial."
        accept:
          actor: "An admin or trial centre rep — always a person. The system never takes this step."
          requirement: "Every basic AND every specific criterion recorded by the investigator and met. Patient declarations do not count here: unmeasured is never the same as met."
        discard:
          actor: "An admin or trial centre rep; also the system, if a MEASURED basic criterion stops being met."
          requirement: "None. Walking a patient back must always be possible, especially when the criteria are what went wrong."
        reject:
          actor: "An admin or trial centre rep; also the system, if a MEASURED specific criterion stops being met."
          requirement: "None, for the same reason."
      notes:
        - "Criteria are read in two tiers. BASIC are the few decisive ones a patient can answer about themselves, and the only ones the public questionnaire asks: they decide the step to Candidate. SPECIFIC are investigator-measured and decide, together with the basic ones, the step to Potential."
        - "The specific score counts how many are met, and the patient list sorts by it: the fullest records come first, which are the ones a rep can actually promote today."
        - "The system only advances a patient as far as Candidate on its own. The step to Potential is always a person's click, because much of what a candidate brings is unverified patient testimony."
        - "The system does walk a patient back on its own when a MEASURED criterion stops being met. Unmeasured never demotes anybody: adding a criterion to a profile does not demote the study's patients."
        - "When the role permits the step but the criteria do not, the button renders disabled with the reason in view rather than vanishing."
        - "Every state change is versioned in change control with the user who made it — or with the system — and when it happened."
        - "A study with no criteria profile, or a profile with no basic criterion, has nothing decisive to verify: forward transitions meet no brake there."
