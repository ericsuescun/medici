# The patient-lifecycle section of the operation manual (/about).
#
# The REST of that page is deliberately Spanish-only and lives in
# OperationManual (see the comment at the top of that file). This one section is
# translated because it documents the mechanics of the app rather than Colombian
# regulation: a rep reading the interface in English still needs to know what
# pressing "Assess" does. OperationManual keeps only the STRUCTURE — which states
# exist, which event connects which pair — and every word comes from here.
#
# State and action names are NOT repeated here: they come from patients.states.*
# and patients.<event>, so the manual always uses the same word as the badge and
# the button the rep is reading about.
es:
  operation_manual:
    lifecycle:
      title: "Ciclo de vida del paciente"
      intro: "El estado dice en qué punto del reclutamiento va una persona. Son tres, siempre en el mismo orden, y sólo cambian por una acción explícita sobre la ficha del paciente: editar sus datos clínicos no mueve nunca su estado."
      intro_note_html: "Las acciones hacia adelante están condicionadas por los <strong>criterios primarios</strong> del estudio — los que deciden — y no por los secundarios, que informan. Las acciones hacia atrás no tienen condición alguna."
      arrival_heading: "Cómo llega aquí"
      transitions_title: "Cómo se pasa de un estado a otro"
      notes_title: "Lo que conviene tener claro"
      moves_to: "pasa a"
      table:
        action: "Acción"
        change: "Cambio"
        who: "Quién puede hacerla"
        requires: "Qué exige"
      direction:
        forward: "Avanza"
        backward: "Retrocede"
      states:
        interested:
          summary: "Alguien que levantó la mano por un estudio. Es el estado inicial y no afirma nada clínico: puede no haber más que un teléfono."
          arrival: "Lo crea el formulario público «¡Quiero participar!» cuando alguien deja su contacto sobre un estudio, o lo registra un representante de sede con la ficha clínica completa."
        candidate:
          summary: "Pasó el triaje: hay evidencia de que cumple todos los criterios básicos, así que merece la revisión de un representante. Esa evidencia puede ser del investigador o declarada por el propio paciente, de modo que un candidato NO está verificado clínicamente."
          arrival: "Automáticamente, en cuanto la evidencia satisface todos los criterios básicos — ya venga del cuestionario del paciente o de los valores que registre un representante. La acción «Evaluar» queda disponible por si hace falta hacerlo a mano."
        potential:
          summary: "Revisado y despejado en los dos niveles: el investigador midió y se cumplen todos los criterios básicos y todos los específicos. Es el resultado del reclutamiento, no una inscripción: vincular al paciente al ensayo ocurre fuera de la plataforma."
          arrival: "Con la acción «Aceptar», que sólo puede hacer una persona — nunca el sistema — sobre un candidato cuyos criterios básicos y específicos estén todos registrados por el investigador y cumplidos."
      transitions:
        assess:
          actor: "El sistema, en cuanto la evidencia alcanza; también un administrador o representante de sede a mano. Cuando la dispara el sistema queda firmada en el control de cambios como «system:criteria-sync», no como una persona."
          requirement: "Todos los criterios básicos respondidos y cumplidos, sirviendo tanto los valores del investigador como las declaraciones del propio paciente. Es el nivel de evidencia de triaje: alcanza para entrar en la lista de revisión, no para entrar al ensayo."
        accept:
          actor: "Administrador o representante de sede, siempre una persona. El sistema nunca da este paso."
          requirement: "Todos los criterios básicos Y todos los específicos con valor registrado por el investigador y cumplidos. Las declaraciones del paciente no cuentan aquí: lo no medido nunca equivale a cumplido."
        discard:
          actor: "Administrador o representante de sede; también el sistema, si un criterio básico medido pasa a no cumplirse."
          requirement: "Ninguna. Devolver a un paciente siempre es posible, sobre todo cuando lo que falló fueron los criterios."
        reject:
          actor: "Administrador o representante de sede; también el sistema, si un criterio específico medido pasa a no cumplirse."
          requirement: "Ninguna, por la misma razón."
      notes:
        - "Los criterios se leen en dos niveles. Los BÁSICOS son los pocos decisivos que el propio paciente puede responder, y son los únicos que el cuestionario público pregunta: deciden el paso a Candidato. Los ESPECÍFICOS los mide el investigador y deciden, junto con los básicos, el paso a Potencial."
        - "El puntaje de los específicos cuenta cuántos se cumplen, y la lista de pacientes ordena por él: los más completos aparecen primero, que son los que un representante puede promover hoy."
        - "El sistema sólo avanza por su cuenta hasta Candidato. El paso a Potencial es siempre un clic de una persona, porque buena parte de lo que trae un candidato es testimonio del paciente sin verificar."
        - "El sistema sí retrocede solo cuando un criterio MEDIDO deja de cumplirse. Lo no medido nunca retrocede a nadie: añadir un criterio a un perfil no degrada a los pacientes del estudio."
        - "Cuando el rol permite avanzar pero los criterios no, el botón aparece deshabilitado con el motivo a la vista, en lugar de desaparecer."
        - "Todo cambio de estado se versiona en el control de cambios con el usuario que lo hizo —o con el sistema— y el momento en que ocurrió."
        - "Un estudio sin perfil de criterios, o con un perfil sin ningún criterio básico, no tiene nada decisivo que verificar: ahí las transiciones hacia adelante no encuentran freno."
